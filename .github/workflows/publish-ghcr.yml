name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "db/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/astrum-repository:20261111211020-bea3c1a
      - uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/astrum-repository-db:16
